<!DOCTYPE html>
<html lang="uk">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Новини страхування | iKasko</title>

	<meta name="description"
		content="Останні новини страхового ринку України: НБУ, МТСБУ, страхові компанії та законодавчі зміни.">

	<link rel="stylesheet" href="css/style.css">

</head>

<body>

	<header class="header">

		<div class="container">

			<a class="logo" href="../">
				iKasko
			</a>

			<h1>
				📰 Новини страхування
			</h1>

			<p class="subtitle">
				НБУ • МТСБУ • Страхові компанії • Законодавство
			</p>

		</div>

	</header>

	<main>

		<section class="toolbar">

			<div class="container toolbar-inner">

				<a class="back-button" href="../">
					← На головну
				</a>

				<input id="searchInput" type="search" placeholder="Пошук новин...">

				<select id="sourceFilter">

					<option value="">
						Усі джерела
					</option>

					<option value="НБУ">
						НБУ
					</option>

					<option value="МТСБУ">
						МТСБУ
					</option>

					<option value="Страхнадзор">
						Страхнадзор
					</option>

					<option value="Мінфін">
						Мінфін
					</option>

					<option value="Forinsurer">
						Forinsurer
					</option>

				</select>

			</div>

		</section>

		<section class="featured-section">

			<div class="container">

				<div id="featuredNews">

				</div>

			</div>

		</section>

		<section class="news-section">

			<div class="container">

				<div id="newsContainer" class="news-grid">

				</div>

			</div>

		</section>

		<section class="load-more-section">

			<div class="container">

				<button id="loadMore" class="load-more">

					Показати ще

				</button>

			</div>

		</section>

	</main>

	<footer class="footer">

		<div class="container">

			<p>
				© 2026 iKasko.com.ua
			</p>

		</div>

	</footer>

	<script type="module" src="js/main.js"></script>

</body>

</html>
