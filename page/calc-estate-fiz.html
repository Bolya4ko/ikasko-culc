<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/null.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/page/calc-estate.css">
	<title>Страхування майна</title>
</head>

<body>
	<a class="back-btn" href="../index.html"><span><svg xmlns="http://www.w3.org/2000/svg" version="1.1"
				xmlns:xlink="http://www.w3.org/1999/xlink" x="0" y="0" viewBox="0 0 24 24" xml:space="preserve">
				<g>
					<path
						d="M22 11H4.414l5.293-5.293a1 1 0 1 0-1.414-1.414l-7 7a1 1 0 0 0 0 1.414l7 7a1 1 0 0 0 1.414-1.414L4.414 13H22a1 1 0 0 0 0-2z"
						fill="#000000" opacity="1" data-original="#000000"></path>
				</g>
			</svg></span> Назад</a>
	<h2>Калькулятор страхування майна Фіз осіб</h2>
	<label>Страхова сума: <input type="number" id="insuranceAmount" min="0"></label>
	<h3>Категорія Нерухоме майно</h3>
	<label><input type="radio" name="propertyType" value="0.00188">Житлові/нежитлові приміщення(конструкція без
		оздоблення)</label><br>
	<label><input type="radio" name="propertyType" value="0.00231">Житлові/нежитлові приміщення(конструкція з
		оздоблення)</label><br>
	<label><input type="radio" name="propertyType" value="0.00202">Приватні будтнки, дачі, госп. будівлі (конструкція без
		оздоблення)</label><br>
	<label><input type="radio" name="propertyType" value="0.00235">Приватні будтнки, дачі, госп. будівлі (конструкція з
		оздоблення)</label><br>
	<label><input type="radio" name="propertyType" value="0.00427">Оздоблення Житлові/нежитлові приміщення,приватні
		будинки, госп. приміщення</label><br>

	<h3>Додаткові опції</h3>
	<label><input type="checkbox" id="equipmentCheck">Меблі</label>
	<input type="number" id="equipmentAmount" class="hidden" min="0"><br>
	<label><input type="checkbox" id="furnitureCheck">Одяг, взуття, коври, штори тощо</label>
	<input type="number" id="furnitureAmount" class="hidden" min="0"><br>
	<label><input type="checkbox" id="computerCheck">Комп’ютерна та побутова техніка</label>
	<input type="number" id="computerAmount" class="hidden" min="0"><br>
	<label><input type="checkbox" id="goodsCheck"> Товари в обороті (товарні запаси, готова продукція, сировина)</label>
	<input type="number" id="goodsAmount" class="hidden" min="0"><br>
	<label><input type="checkbox" id="glassCheck"> Скло, вітрини інші скляні вироби</label>
	<input type="number" id="glassAmount" class="hidden" min="0"><br>

	<button onclick="calculateInsurance()">Розрахувати</button>

	<h3 id="result" class="hidden">Вартість договору страхування складає: <span id="totalCost"></span> грн</h3>
	<a class="back-btn" href="../index.html"><span><svg xmlns="http://www.w3.org/2000/svg" version="1.1"
				xmlns:xlink="http://www.w3.org/1999/xlink" x="0" y="0" viewBox="0 0 24 24" xml:space="preserve">
				<g>
					<path
						d="M22 11H4.414l5.293-5.293a1 1 0 1 0-1.414-1.414l-7 7a1 1 0 0 0 0 1.414l7 7a1 1 0 0 0 1.414-1.414L4.414 13H22a1 1 0 0 0 0-2z"
						fill="#000000" opacity="1" data-original="#000000"></path>
				</g>
			</svg></span> Назад</a>
	<script src="../js/page/calc-estate-fiz.js"></script>
</body>

</html>
